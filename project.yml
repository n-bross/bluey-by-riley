name: GooglyEyes
options:
  bundleIdPrefix: co.visionairy.googly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Your own signing: scripts/build-iphone.sh overrides these two (BLUEY_TEAM, BLUEY_BUNDLE_PREFIX).
    BLUEY_BUNDLE_PREFIX: co.visionairy.googly
    DEVELOPMENT_TEAM: NF73NSV867
    CODE_SIGN_STYLE: Automatic
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: iOS/Common
      - path: App
      - path: Shared
      - path: vendor/provider-icons/OpenAIModelIcon.png
        buildPhase: resources
      - path: vendor/hermes/LICENSE
        buildPhase: resources
      - path: vendor/hermes/HermesModelIcon.png
        buildPhase: resources
      - path: vendor/keramik-avatar/keramik-avatar.js
        buildPhase: resources
      - path: vendor/keramik-3d/three.min.js
        buildPhase: resources
      - path: vendor/keramik-3d/keramik-3d.js
        buildPhase: resources
    dependencies:
      - target: BlueyWidgets
      - target: BlueyBroadcast
    entitlements:
      path: iOS/Bluey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BLUEY_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BLUEY_BUNDLE_PREFIX).phone
        PRODUCT_NAME: Bluey
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Calls keep talking while you switch apps to show Bluey something.
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        BlueyAppGroup: group.$(BLUEY_BUNDLE_PREFIX)
        BlueyBroadcastExtension: $(BLUEY_BUNDLE_PREFIX).phone.broadcast
        CFBundleURLTypes:
          - CFBundleURLName: bluey
            CFBundleURLSchemes:
              - bluey
        NSPhotoLibraryUsageDescription: Bluey hängt Fotos an, wenn du sie im Chat auswählst.
        NSLocalNetworkUsageDescription: Bluey finds the Mac app on your Wi-Fi so the character can look where it points.
        NSCameraUsageDescription: Bluey scans a private pairing code on your Mac to securely connect.
        NSMicrophoneUsageDescription: Talk to your blueberry. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _googly._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf

  # Live Activity on the Lock Screen and in the Dynamic Island ("Bluey fragen", call status).
  BlueyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/Widgets
      - path: iOS/Common
      - path: Shared/Palette.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BLUEY_BUNDLE_PREFIX).phone.widgets
        PRODUCT_NAME: BlueyWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: iOS/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Screen sharing during calls: ReplayKit hands the screen to this extension, which leaves the
  # latest frame in the shared app group for Bluey to look at.
  BlueyBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/Broadcast
    entitlements:
      path: iOS/Broadcast/BlueyBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BLUEY_BUNDLE_PREFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BLUEY_BUNDLE_PREFIX).phone.broadcast
        PRODUCT_NAME: BlueyBroadcast
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    info:
      path: iOS/Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        BlueyAppGroup: group.$(BLUEY_BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
